workflows:
  ios-workflow:
    name: Build iOS App
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
scripts:
  - name: Build iOS App
    script: |
      flutter build ipa --release --no-codesign
      # أمر لضغط وتوليد ملف ipa يدوياً من مخرجات الأرشيف
      cd build/ios/archive/Runner.xcarchive/Products/Applications/
      mkdir Payload
      mv Runner.app Payload/
      zip -r ../../../ipa-output.zip Payload
      mv ../../../ipa-output.zip ../../../Runner.ipa
    artifacts:
      - build/ios/Runner.ipa