workflows:
  ios-workflow:
    name: Build iOS App
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
scripts:
  - name: Build iOS App
    script: |
      flutter build ipa --release --no-codesign
      mkdir -p build/ios/Payload
      cp -r build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app build/ios/Payload/
      cd build/ios
      zip -r Runner.ipa Payload
artifacts:
  - build/ios/**/*.ipa
  - build/**/*.ipa